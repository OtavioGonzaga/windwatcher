[package]
name = "windwatcher-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Official self-hosted server for Windwatcher."
keywords = ["messaging", "self-hosted", "server"]
categories = ["network-programming"]

[[bin]]
name = "windwatcher"
path = "src/main.rs"
doc = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "matched-path", "tokio", "ws", "http1"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
governor = { version = "0.10", default-features = false, features = ["std", "dashmap"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
figment = { version = "0.10", features = ["env", "toml"] }
humantime = "2"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "sensitive-headers"] }
utoipa = { version = "6", features = ["axum_extras", "time", "uuid"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", default-features = false, features = ["axum", "vendored", "minified"] }
uuid = { version = "1", features = ["v7"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
windwatcher = { path = "../windwatcher", version = "0.1.0", features = ["sqlite", "postgres", "mysql", "queue-sqlite", "queue-postgres", "queue-mysql", "queue-redis", "jwt-hs256"] }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
uuid = { version = "1", features = ["v7"] }
tokio = { version = "1", features = ["test-util"] }
log = "0.4"
tracing-log = "0.2"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio-tungstenite = "0.29"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
