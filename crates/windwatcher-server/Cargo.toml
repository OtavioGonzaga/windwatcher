[package]
name = "windwatcher-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Official self-hosted server for Windwatcher."
keywords = ["messaging", "self-hosted", "server"]
categories = ["network-programming"]

[[bin]]
name = "windwatcher"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
figment = { version = "0.10", features = ["env", "toml"] }
humantime = "2"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
windwatcher = { path = "../windwatcher", version = "0.1.0", features = ["sqlite", "jwt-hs256"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
