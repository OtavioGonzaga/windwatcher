[package]
name = "windwatcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Embeddable messaging engine for Rust applications."
keywords = ["messaging", "embedded", "self-hosted"]
categories = ["network-programming"]

[features]
default = []
jwt-hs256 = ["dep:hmac"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
queue-sqlite = ["dep:sqlx", "sqlx/sqlite"]

[dependencies]
argon2 = { version = "0.5", features = ["std", "zeroize"] }
base64 = "0.22"
hmac = { version = "0.12", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", optional = true, default-features = false, features = ["runtime-tokio", "migrate", "macros"] }
thiserror = "2"
time = "0.3"
uuid = { version = "1", features = ["v7"] }
zeroize = "1"

[dev-dependencies]
futures-executor = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
