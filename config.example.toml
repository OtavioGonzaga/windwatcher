# Windwatcher configuration. Precedence: defaults < TOML < WINDWATCHER__... < CLI.

[storage.sqlite]
# Omit url for the mode-specific default database path.
# url = "/var/lib/windwatcher/windwatcher.db"
create_if_missing = true
max_connections = 8
busy_timeout = "5s"

[auth]
registration = "closed"

[auth.session]
access_token_ttl = "15m"
session_ttl = "30d"

[auth.jwt]
issuer = "windwatcher"
secret_file = "/etc/windwatcher/jwt.key"
# secret = "replace-with-a-secret-at-least-32-bytes-long"

[messages]
# Inclusive UTF-8 byte limit for new sends/edits; 131072 bytes = 128 KiB.
max_content_bytes = 131072

[http.cors]
# Empty denies cross-origin browser access; ["*"] explicitly allows any origin.
allowed_origins = []

[http.rate_limit]
enabled = true

[http.rate_limit.general]
requests = 100
period = "1s"
burst = 200

[http.rate_limit.auth]
requests = 10
period = "1m"
burst = 10

[logging]
filter = "info"
format = "compact"
