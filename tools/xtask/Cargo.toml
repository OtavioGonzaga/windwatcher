[package]
name = "xtask"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
regex = "1"
sha2 = "0.11"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
tempfile = "3"
