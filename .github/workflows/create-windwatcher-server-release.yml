name: Create windwatcher-server release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v prefix or build metadata
        required: true
        type: string

permissions: {}

concurrency:
  group: windwatcher-release
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4
  VERSION: ${{ inputs.version }}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: ci
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    outputs:
      release_commit: ${{ steps.prepare.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - id: prepare
        run: scripts/ci/prepare-release.sh windwatcher-server "$VERSION"

  dependency-preflight:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - run: cp automation/rust-toolchain.toml rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: |
            automation -> target
            release -> target
      - run: |
          dependency=$(cargo run --quiet --locked --manifest-path automation/tools/xtask/Cargo.toml -- release dependency windwatcher-server "$VERSION" --root "$GITHUB_WORKSPACE/release")
          cargo run --quiet --locked --manifest-path automation/tools/xtask/Cargo.toml -- release registry dependency windwatcher "$dependency" --root "$GITHUB_WORKSPACE/release"
          cd release
          cargo metadata --locked --format-version 1 > /dev/null
          cargo check --workspace --all-features --locked

  build-dist:
    needs: [prepare, dependency-preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - run: cp automation/rust-toolchain.toml rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: |
            automation -> target
            release -> target
      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio
          automation/scripts/ci/install-nfpm.sh "$RUNNER_TEMP/nfpm"
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      - env:
          ARCH: ${{ matrix.arch }}
        run: automation/scripts/build-release-artifacts.sh "$VERSION" "$ARCH" "$RUNNER_TEMP/dist" --root "$GITHUB_WORKSPACE/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: windwatcher-server-dist-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  validate-artifacts:
    needs: [prepare, build-dist]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - run: cp automation/rust-toolchain.toml rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: |
            automation -> target
            release -> target
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          pattern: windwatcher-server-dist-*
          path: ${{ runner.temp }}/build-dist
      - name: Validate complete public asset inventory
        run: |
          cargo run --quiet --locked --manifest-path automation/tools/xtask/Cargo.toml -- release artifacts collect "$VERSION" "$RUNNER_TEMP/build-dist" "$RUNNER_TEMP/dist"
          cargo run --quiet --locked --manifest-path automation/tools/xtask/Cargo.toml -- release artifacts validate "$VERSION" "$RUNNER_TEMP/dist" --create
          cd "$RUNNER_TEMP/dist"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: windwatcher-server-public-assets
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish-server-crate:
    needs: [prepare, validate-artifacts]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - run: cp automation/rust-toolchain.toml rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: |
            automation -> target
            release -> target
      - run: |
          cd release
          cargo package -p windwatcher-server --locked
          cargo publish -p windwatcher-server --dry-run --locked --registry crates-io
      - name: Publish or verify exact registry version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo run --quiet --locked --manifest-path automation/tools/xtask/Cargo.toml -- release registry publish windwatcher-server "$VERSION" --root "$GITHUB_WORKSPACE/release"

  publish-oci:
    needs: [prepare, publish-server-crate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - run: cp automation/rust-toolchain.toml rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: |
            automation -> target
            release -> target
      - name: Install OCI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo
      - name: Publish native architecture or verify recovery
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
        run: |
          printf '%s' "$GH_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cargo run --quiet --locked --manifest-path automation/tools/xtask/Cargo.toml -- release oci architecture "$VERSION" "$RELEASE_COMMIT" --arch "$ARCH" --root "$GITHUB_WORKSPACE/release"
      - if: always()
        run: podman logout ghcr.io

  publish-oci-manifest:
    needs: [prepare, publish-oci]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - run: cp automation/rust-toolchain.toml rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: |
            automation -> target
            release -> target
      - run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
        run: |
          printf '%s' "$GH_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cargo run --quiet --locked --manifest-path automation/tools/xtask/Cargo.toml -- release oci manifest "$VERSION" "$RELEASE_COMMIT" --root "$GITHUB_WORKSPACE/release"
      - if: always()
        run: podman logout ghcr.io

  finalize-github:
    needs: [prepare, publish-oci-manifest]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
          path: release
          fetch-depth: 0
      - run: cp automation/rust-toolchain.toml rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: |
            automation -> target
            release -> target
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: windwatcher-server-public-assets
          path: ${{ runner.temp }}/assets
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
        run: cargo run --quiet --locked --manifest-path automation/tools/xtask/Cargo.toml -- release github finalize windwatcher-server "$VERSION" "$RELEASE_COMMIT" --assets "$RUNNER_TEMP/assets" --root "$GITHUB_WORKSPACE/release"
