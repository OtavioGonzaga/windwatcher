name: Documentation

on:
  workflow_dispatch:

permissions: {}

env:
  CARGO_BUILD_JOBS: 4
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-key: documentation
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: website/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun --bun playwright install --with-deps chromium
      - run: bun run format:check
      - run: bun run check
      - run: bun run test
      - name: OpenAPI contract regression tests (sequential)
        working-directory: .
        run: |
          cargo test -p windwatcher-server --example export_openapi --locked -- --test-threads=1
          cargo test -p windwatcher-server --test http openapi --locked -- --test-threads=1
          cargo test -p windwatcher-server --test http_messaging openapi --locked -- --test-threads=1
          cargo test -p windwatcher-server --test realtime realtime_openapi_contract --locked -- --test-threads=1
      - name: Validate root and project Pages exports (sequential)
        run: |
          for base_path in '' '/windwatcher'; do
            export NEXT_PUBLIC_BASE_PATH="$base_path"
            bun run build
            bun run validate
            bun run test:e2e
          done
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-browser-report
          path: website/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload static Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
