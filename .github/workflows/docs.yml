name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/docs.yml'
      - '.github/dependabot.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/docs.yml'
      - '.github/dependabot.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions: {}

env:
  CARGO_BUILD_JOBS: 4
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-key: documentation
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - name: OpenAPI contract regression tests (sequential)
        working-directory: .
        run: |
          cargo test -p windwatcher-server --example export_openapi --locked -- --test-threads=1
          cargo test -p windwatcher-server --test http openapi --locked -- --test-threads=1
          cargo test -p windwatcher-server --test http_messaging openapi --locked -- --test-threads=1
          cargo test -p windwatcher-server --test realtime realtime_openapi_contract --locked -- --test-threads=1
      - name: Validate root and project Pages exports (sequential)
        run: |
          for base_path in '' '/windwatcher'; do
            export NEXT_PUBLIC_BASE_PATH="$base_path"
            pnpm build
            pnpm validate
            pnpm test:e2e
          done
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-browser-report
          path: website/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload static Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
